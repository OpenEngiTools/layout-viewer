name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1
      - run: uv sync --locked --extra test
      - run: uv run pytest
        env:
          QT_QPA_PLATFORM: offscreen
