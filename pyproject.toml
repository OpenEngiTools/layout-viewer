[build-system]
requires = ["flit_core>=3.11,<5"]
build-backend = "layout_viewer_build"
backend-path = ["_build_backend"]

[tool.flit.sdist]
include = ["_build_backend", "README.md", "LICENSE"]
exclude = ["_build_backend/__pycache__"]

[tool.flit.module]
name = "layout_viewer_core"

[project]
name = "layout_viewer_core"
dynamic = ["version", "description"]
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "PySide6>=6.8.3,<7",
    "mapbox-earcut",
]

[project.optional-dependencies]
test = ["pytest"]