[build-system]
requires = ["flit_core>=3.11,<5"]
build-backend = "layout_viewer_build"
backend-path = ["_build_backend"]

[tool.flit.sdist]
include = ["_build_backend", "tools/bake_viewer_shaders.py"]
exclude = ["src/layout_viewer/qt/shaders/*.qsb", "_build_backend/__pycache__"]

[tool.flit.module]
name = "layout_viewer"

[project]
name = "layout-viewer"
dynamic = ["version", "description"]
readme = "README.md"
requires-python = ">=3.10,<4"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "ANSYS, Inc.", email = "pyansys.core@ansys.com"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Visualization",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy>=1.20.0,<3",
    "PySide6>=6.8.3,<7",
    "mapbox-earcut>=1.0.1,<3",
]

[project.scripts]
layout-viewer-demo = "layout_viewer.__main__:main"
